# configs/signals.yaml
# M6: Signals + Aggregator configuration
# ----------------------------------------

# ── Signal: s_div (Context Divergence) ──────────────────────────────────────
s_div:
  type: continuous
  # Embedding model for Strategy A (cosine divergence)
  embed_model: "BAAI/bge-small-en-v1.5"
  # KL normalization cap (for Strategy B when logprobs available)
  kl_max_clip: 5.0

# ── Signal: s_ret (Retrieval Strength) ──────────────────────────────────────
s_ret:
  type: continuous
# No extra config needed — uses rr.metadata["rerank_scores"] or rank position.

# ── Signal: s_ver (V1 Verification Encoding) ────────────────────────────────
s_ver:
  type: categorical
  # Encoding: MATCH→0.0, NOT_FOUND/NA→0.5, MISMATCH→1.0
  # (Matches v1_deterministic.py status strings — do not change)

# ── Signal: s_nli (NLI Entailment) ─────────────────────────────────────────
s_nli:
  type: continuous
  # Default value when V2 was skipped (NLI not run)
  default_skipped: 0.5

# ── Signal: s_ent (Token Entropy) ───────────────────────────────────────────
s_ent:
  type: continuous
  # Maximum -log(p) we normalize against (~0.67% probability)
  max_entropy_clip: 5.0
  # Heuristic: characters per token for span approximation
  chars_per_token: 4

# ── Aggregator (LightGBM) ───────────────────────────────────────────────────
aggregator:
  # Training
  n_estimators: 300
  learning_rate: 0.05
  max_depth: 4
  num_leaves: 31
  random_state: 42

  # Data
  val_frac: 0.15      # fraction of agg_train held out for validation
  seed: 42

  # I/O paths
  model_path: "models/aggregator/aggregator_v1.pkl"
  features_path: "data/processed/feature_table.parquet"
  out_dir: "models/aggregator/"

# ── Probability Calibration ──────────────────────────────────────────────────
calibration:
  method: "isotonic"          # isotonic | platt
  calibrator_path: "models/aggregator/calibrator_v1.pkl"

# ── Fallback Weights (used when model not yet trained) ───────────────────────
fallback_weights:
  s_ver:  0.35
  s_nli:  0.30
  s_ent:  0.15
  s_ret:  0.10   # inverted internally: high s_ret = good = lower risk
  s_div:  0.10   # inverted internally: high s_div = grounded = lower risk
